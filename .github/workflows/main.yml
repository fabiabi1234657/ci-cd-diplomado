name: CI-CD Basico

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Integracion Continua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos requeridos
        run: |
          test -f home.html
          test -f styles.css
          echo "Archivos home.html y styles.css verificados."

  cd:
    name: Preparacion de Despliegue
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Simulacion de despliegue
        run: echo "Artefactos listos para el despliegue en el entorno de Staging"
