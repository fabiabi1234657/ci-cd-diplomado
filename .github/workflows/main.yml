name: CI-CD Fabian

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Integracion Continua CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Verificar archivos requeridos
        run: |
          test -f index.html
          test -f styles.css
          echo "Archivos index.html y styles.css verificados."

  cd:
    name: Preparacion de Despliegue CD
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Simulacion de despliegue
        run: echo "Artefactos listos para el despliegue en el entorno de Staging"
